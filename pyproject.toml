[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cart-pendulum-lab"
version = "0.1.0"
description = "A lesson-by-lesson exploration of cart-mounted pendulum physics and control."
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
render = ["matplotlib>=3.7", "pillow>=9"]
train = ["stable-baselines3>=2.4,<3", "gymnasium>=0.29,<2", "torch>=2.3,<3"]
agent = ["openai>=1.68,<3"]

[tool.setuptools.packages.find]
include = ["cart_pendulum*"]
